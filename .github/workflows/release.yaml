name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.0)"
        required: true
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: "master"

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Compile and build model
        run: npm run compile && npm run build

      - name: Bundle modules
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          remodel run ci/bundle.lua dist/Orca.lua "$VERSION" minify
          remodel run ci/bundle.lua dist/Orca.debug.lua "$VERSION-debug" debug verbose

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.version }}
          files: |
            dist/Orca.lua
            dist/Orca.debug.lua
            dist/Orca.rbxm

      - name: Add release marker commit to graph
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.version }}"
          RELEASE_MESSAGE="🐋 Release $RELEASE_TAG"

          git fetch origin master:refs/remotes/origin/master

          if git log --format=%s origin/master | grep -Fx "$RELEASE_MESSAGE"; then
            echo "Release marker already exists: $RELEASE_MESSAGE"
            exit 0
          fi

          git switch --force-create release-marker origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "$RELEASE_MESSAGE"
          git push origin HEAD:master
